auto-spawn:
  enabled: true
  interval-minutes: 20

# Время в минутах до открытия сундуков
game-duration-minutes: 10

# Радиус зоны захвата
zone-radius: 10

# Очки за секунду в зоне
points-per-second: 1

# Бонус за убийство в зоне
kill-bonus-points: 15

# Редкость маяка: common, rare, epic, legendary
beacon-rarity: common

# Лут для каждой редкости (формат: МАТЕРИАЛ:КОЛИЧЕСТВО:ШАНС%)
loot:
  common:
    chest1:
      - "IRON_INGOT:3:70"
      - "COAL:5:80"
      - "BREAD:2:50"
    chest2:
      - "GOLD_INGOT:1:40"
      - "ARROW:8:60"
  rare:
    chest1:
      - "DIAMOND:2:50"
      - "IRON_INGOT:5:70"
      - "GOLDEN_APPLE:1:30"
    chest2:
      - "EMERALD:3:40"
      - "ENDER_PEARL:2:35"
      - "IRON_SWORD:1:20"
  epic:
    chest1:
      - "DIAMOND:5:60"
      - "DIAMOND_SWORD:1:25"
      - "GOLDEN_APPLE:3:40"
    chest2:
      - "NETHERITE_INGOT:1:15"
      - "ENDER_PEARL:5:50"
      - "ENCHANTED_GOLDEN_APPLE:1:10"
  legendary:
    chest1:
      - "NETHERITE_INGOT:2:30"
      - "DIAMOND_BLOCK:1:20"
      - "ENCHANTED_GOLDEN_APPLE:2:25"
    chest2:
      - "NETHERITE_SWORD:1:10"
      - "ELYTRA:1:10"
      - "NETHER_STAR:1:5"

messages:
  spawned: "&6[Маяк] &eМаяк заспавнился на X:%x% Y:%y% Z:%z% (Редкость: %rarity%)"
  entering-zone: "&aВы вошли в зону маяка!"
  leaving-zone: "&cВы покинули зону маяка!"
  chests-unlocked: "&6[Маяк] &eСундуки разблокированы! У вас 1 минута чтобы забрать лут!"
  beacon-despawned: "&6[Маяк] &eМаяк исчез!"
  winner-message: "&6[Маяк] &aПобедитель: &f%player% &aс &f%score% &aочками!"
