name: Build BeaconRaid

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Maven
        run: mvn clean package -f BeaconRaid/pom.xml

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BeaconRaid
          path: BeaconRaid/target/BeaconRaid.jar
